name: Build desktop packages

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to upload assets to
        required: true
        default: v0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows NSIS
    runs-on: windows-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Windows installer
        run: npm run package:windows

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-nsis
          path: apps/desktop/release/*.exe
          if-no-files-found: error

      - name: Upload installer to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" apps/desktop/release/*.exe --clobber

  linux:
    name: Linux packages
    runs-on: ubuntu-24.04
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build Linux packages
        run: npm run package:linux

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.pkg.tar.zst
          if-no-files-found: error

      - name: Upload packages to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: gh release upload "$RELEASE_TAG" apps/desktop/release/*.AppImage apps/desktop/release/*.deb apps/desktop/release/*.pkg.tar.zst --clobber
